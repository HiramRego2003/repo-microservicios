 spring:
  data:
    redis:
      host: localhost
      port: 6379
      
  cloud:
    gateway:
      discovery:
        locator:
          enable: false
          lowe-case-service-id: true
          
      routes:

        - id: inube-auth-auth
          uri: lb://INUBE-AUTHENTICATION-SERVICE
          predicates: 
            - Path=/api/inube/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}"
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10

        - id: inube-auth-user
          uri: lb://INUBE-AUTHENTICATION-SERVICE
          predicates:
            - Path=/api/inube/user/**
          filters:
            - AuthenticationFilter
            
        - id: inube-service
          uri: lb://INUBE-SERVICE
          predicates:
          - Path=/api/inube/service/ **
            filters:
            - AuthenticationFilter

        - id: books-service
            uri: lb://BOOKS-SERVICE

            predicates:
            - Path=/api/inube/books/ **

            filters:
            - AuthenticationFilter  


